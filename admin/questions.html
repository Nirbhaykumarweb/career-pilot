<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Admin Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body>
    <div class="admin-shell container-fluid p-0">
        <div class="row g-0">
            <aside class="col-lg-2 admin-sidebar p-3">
                <div class="d-flex align-items-center mb-4">
                    <span class="brand-badge"><img
                            src="https://github.com/Nirbhaykumarweb/career-pilot/blob/main/carreer_pilot_logo-removebg-preview.png?raw=true"
                            alt="Career Pilot logo" /></span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="admin.html"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
                    <a class="nav-link" href="companies.html"><i class="fa-solid fa-building me-2"></i>Companies</a>
                    <a class="nav-link active" href="questions.html"><i
                            class="fa-solid fa-question-circle me-2"></i>Questions</a>
                    <a class="nav-link" href="experiences.html"><i class="fa-solid fa-comments me-2"></i>Interview
                        Experiences</a>
                    <a class="nav-link" href="users.html"><i class="fa-solid fa-users me-2"></i>Users</a>
                    <a class="nav-link" href="interviews.html"><i class="fa-solid fa-robot me-2"></i>AI Interviews</a>
                    <a class="nav-link" href="plans.html"><i class="fa-solid fa-crown me-2"></i>Premium Plans</a>
                    <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear me-2"></i>Settings</a>
                    <a class="nav-link" href="../index.html"><i
                            class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
                </nav>
            </aside>

            <main class="col-lg-10 admin-content">
                <div class="admin-topbar px-4 py-3 d-flex justify-content-between align-items-center rounded-3 mb-4">
                    <div>
                        <h4 class="mb-0">Questions</h4>
                    </div>
                    <button class="btn btn-primary btn-sm">+ Add Question</button>
                </div>

                <div class="admin-card p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Topic</th>
                                    <th>Type</th>
                                    <th>Difficulty</th>
                                    <th>Company</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Arrays</td>
                                    <td>DSA</td>
                                    <td>Medium</td>
                                    <td>TCS</td>
                                    <td><button class="btn btn-sm btn-outline-primary">Edit</button> <button
                                            class="btn btn-sm btn-outline-danger">Delete</button></td>
                                </tr>
                                <tr>
                                    <td>DBMS</td>
                                    <td>Technical</td>
                                    <td>Easy</td>
                                    <td>Infosys</td>
                                    <td><button class="btn btn-sm btn-outline-primary">Edit</button> <button
                                            class="btn btn-sm btn-outline-danger">Delete</button></td>
                                </tr>
                                <tr>
                                    <td>HR Intro</td>
                                    <td>HR</td>
                                    <td>Easy</td>
                                    <td>All</td>
                                    <td><button class="btn btn-sm btn-outline-primary">Edit</button> <button
                                            class="btn btn-sm btn-outline-danger">Delete</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
