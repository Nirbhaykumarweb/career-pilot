<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body>
    <div class="auth-layout">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-9 auth-card">
                    <div class="row g-0">
                        <div class="col-lg-5 auth-side">
                            <div class="d-flex align-items-center mb-4">
                                <span class="brand-badge"><img
                                        src="https://github.com/Nirbhaykumarweb/career-pilot/blob/main/carreer_pilot_logo-removebg-preview.png?raw=true"
                                        alt="Career Pilot logo" /></span>
                            </div>
                            <h2 class="mb-3">Welcome back</h2>
                            <p class="text-white-50">Your preparation journey continues. Log in to access company plans,
                                question banks, AI interview simulations, and progress tracking.</p>
                            <div class="mt-4">
                                <div class="hero-card">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="fw-bold">Preparation Level</span>
                                        <span class="chip">High</span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar bg-success" style="width:84%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-7">
                            <div class="form-card">
                                <div class="text-center mb-4">
                                    <h3>Login to Your Account</h3>
                                </div>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email"
                                            placeholder="Enter your email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Enter your password" required>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe">
                                            <label class="form-check-label" for="rememberMe">Remember me</label>
                                        </div>
                                        <a href="forgot-password.html" class="text-primary">Forgot Password?</a>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                                    <a href="admin/admin.html" class="btn btn-outline-secondary w-100 mb-3">Admin
                                        Login</a>
                                    <button type="button" class="btn btn-outline-primary w-100 mb-3"><i
                                            class="fa-brands fa-google me-2"></i>Login with Google</button>
                                    <div class="text-center">
                                        <span class="text-muted-soft">New here?</span>
                                        <a href="register.html" class="text-primary fw-semibold">Register</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
