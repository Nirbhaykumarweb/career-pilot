<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body>
    <div class="auth-layout">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-9 auth-card">
                    <div class="row g-0">
                        <div class="col-lg-5 auth-side">
                            <div class="d-flex align-items-center mb-4">
                                <span class="brand-badge"><img
                                        src="https://github.com/Nirbhaykumarweb/career-pilot/blob/main/carreer_pilot_logo-removebg-preview.png?raw=true"
                                        alt="Career Pilot logo" /></span>
                            </div>
                            <h2 class="mb-3">Create your account</h2>
                            <p class="text-white-50">Join the platform and start preparing for companies, aptitude
                                rounds, DSA, projects, HR interviews, and AI mock assessment.</p>
                            <div class="mt-4">
                                <div class="hero-card">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="fw-bold">Career Readiness</span>
                                        <span class="chip">New</span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar bg-info" style="width:65%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-7">
                            <div class="form-card">
                                <div class="text-center mb-4">
                                    <h3>Create an Account</h3>
                                </div>
                                <form id="registerForm">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="fullName" class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="fullName"
                                                placeholder="Enter your full name" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email"
                                                placeholder="Enter your email" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="mobile" class="form-label">Mobile Number</label>
                                            <input type="tel" class="form-control" id="mobile"
                                                placeholder="Enter mobile number" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="college" class="form-label">College</label>
                                            <input type="text" class="form-control" id="college"
                                                placeholder="College name" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="branch" class="form-label">Branch</label>
                                            <input type="text" class="form-control" id="branch" placeholder="Branch"
                                                required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="semester" class="form-label">Semester</label>
                                            <input type="text" class="form-control" id="semester"
                                                placeholder="Current semester" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="password" class="form-label">Password</label>
                                            <input type="password" class="form-control" id="password"
                                                placeholder="Create a password" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                                            <input type="password" class="form-control" id="confirmPassword"
                                                placeholder="Confirm password" required>
                                        </div>
                                    </div>
                                    <div class="form-check mt-3">
                                        <input class="form-check-input" type="checkbox" id="terms">
                                        <label class="form-check-label" for="terms">I agree to Terms &
                                            Conditions.</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 mt-4">Create Account</button>
                                    <div class="text-center mt-3">
                                        <span class="text-muted-soft">Already have an account?</span>
                                        <a href="login.html" class="text-primary fw-semibold">Login</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>

</body>

</html>
