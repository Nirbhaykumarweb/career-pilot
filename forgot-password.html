<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body>
    <div class="auth-layout">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 auth-card">
                    <div class="form-card">
                        <div class="text-center mb-4">
                            <h3>Reset Password</h3>
                            <p class="text-muted-soft">Enter your email to receive a password reset link.</p>
                        </div>
                        <form id="forgotForm">
                            <div class="mb-3">
                                <label for="forgotEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="forgotEmail"
                                    placeholder="Enter your registered email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                            <div class="text-center mt-3">
                                <a href="login.html" class="text-primary fw-semibold">Back to Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>

</html>
